<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velas de deseos</title>
<meta name="app-version" content="2026-11-21-espacios-hoja">
<meta name="theme-color" content="#f6f3ee">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --line:#e6e1d8; --line2:#cfc8bb;
    --txt:#2b2622; --txt2:#6f675e; --muted:#a39b90;
    --rojo:#c0392b; --rojo-bg:#fbeaea; --verde:#3b7a17; --verde-bg:#eaf3de;
    --rosa:#b03a68; --acc:#1f6fb2; --acc-bg:#e6f1fb; --warn:#8a5a00; --warn-bg:#fdf1d6;
    --ok:#2f7a33; --ok-bg:#e5f3e6; --cafe:#7a4e2d; --amb:#e8a33a;
    --ease-out:cubic-bezier(0.23,1,0.32,1); --rojo-v:#e05a4b; --verde-v:#6fae3f;
  }
  *{box-sizing:border-box}
  html{overscroll-behavior-y:none}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px max(16px,calc((100% - 532px)/2)) 10px;display:flex;align-items:center;gap:8px}
  header i{font-size:22px;color:#c98a2b}
  header h1{font-size:19px;font-weight:600;margin:0}
  main{padding:0 14px 90px;max-width:560px;margin:0 auto}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .mt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .mt small{display:block;font-size:12px;color:var(--txt2)}
  .mt b{font-size:24px;font-weight:600}
  .mt b{font-variant-numeric:tabular-nums}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
  .wish{padding:12px 0;border-top:1px solid var(--line)}
  .wish:first-child{border-top:none}
  .wish.done{opacity:.55}
  .wn{font-size:16px;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
  .ln{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 0}
  .lb{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:6px}
  .bar{height:6px;border-radius:3px;background:#efe9df;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--amb);transition:width 200ms var(--ease-out)}
  .bar i.full{background:var(--verde)}
  .num{font-size:12px;margin-top:4px;color:var(--txt2);font-variant-numeric:tabular-nums}
  .num b{font-weight:600}
  .num .f{color:var(--warn)} .num .ok{color:var(--ok)} .num .na{color:var(--muted)}
  .st{display:flex;align-items:center;gap:2px}
  .st button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1;color:var(--txt);cursor:pointer}
  .st button:active{transform:scale(.94);background:var(--bg)}
  .st span{min-width:28px;text-align:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
  .sep{font-size:12px;color:var(--muted);padding:14px 0 2px;border-top:1px solid var(--line)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .estado:disabled{opacity:1;cursor:default}
  .estado{margin-left:auto;font-size:12px;color:var(--txt2);display:flex;align-items:center;gap:6px;border:none;background:none;padding:6px 0;font-weight:400}
  .estado i{width:7px;height:7px;border-radius:50%;background:var(--verde);display:inline-block}
  .estado.saving i{background:var(--amb)} .estado.err{color:var(--rojo);text-decoration:underline;cursor:pointer} .estado.err i{background:var(--rojo)}
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:inherit;transition:transform 120ms var(--ease-out)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  ::selection{background:#f3dcb8}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chips button:last-child{margin-right:28px}
  .chips button{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:0 14px;height:40px;font-size:14px;color:var(--txt);cursor:pointer}
  .chips button.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.5}
  .card.esp{border-style:dashed}
  .card.arm{opacity:.7}
  .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ctop b{font-weight:600}
  .chips button:active,nav button:active{transform:scale(.97)}
  .sub{color:var(--txt2);font-size:13px;margin-bottom:6px}
  .pill{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-listo{background:var(--acc-bg);color:var(--acc)} .p-falta{background:var(--warn-bg);color:var(--warn)}
  .p-arm{background:var(--ok-bg);color:var(--ok)} .p-esp{background:var(--warn-bg);color:var(--warn)}
  .lbl-r{color:var(--rojo);font-weight:600} .lbl-v{color:var(--verde);font-weight:600} .lbl-p{color:var(--rosa);font-weight:600}
  .aviso{font-size:13px;margin-top:6px;color:var(--warn)}
  .btn{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:14px;cursor:pointer;color:var(--txt)}
  .btn.main{background:var(--cafe);color:#fff;border-color:var(--cafe)}
  .btn:active{transform:scale(.98)}
  .btn.link{border:none;background:none;color:var(--txt2);text-decoration:underline;margin-top:4px;padding:4px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:none;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--txt2);cursor:pointer}
  nav button i{font-size:24px}
  nav button.on{color:var(--cafe);font-weight:600}
  .vacio{color:var(--txt2);font-size:14px;text-align:center;padding:24px 0}
  /* Avisos */
  .toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;pointer-events:none;width:min(420px,calc(100% - 24px));background:var(--txt);color:#fff;border-radius:14px;padding:10px 8px 10px 14px;z-index:30;display:flex;align-items:center;gap:10px;min-height:52px;box-shadow:0 8px 24px rgba(43,38,34,.18);transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast .t-ic{font-size:22px;flex-shrink:0;color:#f3dcb8}
  .toast.ok .t-ic{color:#9fd39a} .toast.listo .t-ic{color:#f4c06b}
  .toast .t-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .toast .t-tit{font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .toast .t-det{font-size:12.5px;color:#d9cfc2}
  .toast .t-det:empty{display:none}
  .toast button{border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;height:38px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
  .toast button:empty{display:none}
  /* Botón flotante */
  .fab{position:fixed;right:max(16px,calc((100% - 560px)/2 + 4px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:none;background:var(--cafe);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(122,78,45,.35);z-index:20;cursor:pointer;transition:transform 220ms var(--ease-out)}
  .fab[hidden]{display:none}
  .fab:active{transform:scale(.94)}
  body.toast-on .fab{transform:translateY(-66px)}
  body.toast-on .fab:active{transform:translateY(-66px) scale(.94)}
  #vPaq{padding-bottom:70px}
  /* Hoja inferior */
  .sheet{position:fixed;inset:0;z-index:40}
  .sheet[hidden]{display:none}
  .sheet-fondo{position:absolute;inset:0;background:rgba(30,24,20,.62);opacity:0;transition:opacity 250ms ease}
  .sheet.open .sheet-fondo{opacity:1}
  .sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:22px 22px 0 0;padding:0;transform:translateY(100%);transition:transform 300ms cubic-bezier(0.32,0.72,0,1)}
  .sheet.open .sheet-panel{transform:none}
  .sheet-hdr{background:var(--cafe);color:#fff;padding:10px 18px 16px;position:sticky;top:0;z-index:2}
  .sheet-asa{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 8px}
  .sheet-top{display:flex;justify-content:space-between;align-items:center}
  .sheet-top h2{font-size:20px;margin:0;font-weight:600;color:#fff}
  .sheet-x{border:none;background:none;color:#f3dcb8;font-size:15px;height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .n-prev{margin-top:10px;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:14px}
  .n-vel{display:flex;gap:5px;align-items:flex-end;height:40px;min-width:91px}
  .n-vel span{width:11px;height:32px;border-radius:3px 3px 4px 4px;position:relative;flex-shrink:0;transition:background 200ms var(--ease-out)}
  .n-vel span::before{content:"";position:absolute;left:50%;top:-7px;width:2px;height:6px;background:#f3dcb8;transform:translateX(-50%);border-radius:1px}
  .n-vel span.e{background:transparent;border:1.5px dashed rgba(255,255,255,.55)}
  .n-pt{min-width:0;font-size:13px;color:#f3dcb8;line-height:1.4}
  .n-pt b{display:block;color:#fff;font-weight:600;font-size:15px;overflow-wrap:anywhere}
  .sheet-body{padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px))}
  .n-lbl{font-weight:600;margin-top:18px}
  .sheet-body label.n-lbl{margin-top:2px}
  .sheet .in{border-width:1.5px;height:50px}
  .sheet .in:focus{outline:none;border-color:var(--cafe);box-shadow:0 0 0 3px rgba(122,78,45,.15)}
  .n-opts{display:grid;gap:8px}
  .n-o2{grid-template-columns:1fr 1fr} .n-o3{grid-template-columns:repeat(3,1fr)}
  .n-opt{border:1.5px solid var(--line2);background:#fff;border-radius:14px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--txt2);padding:8px 4px;cursor:pointer;transition:transform 120ms var(--ease-out),border-color 150ms,background 150ms}
  .n-opt:active{transform:scale(.97)}
  .n-opt.on{border-color:var(--cafe);background:#fbf3e6;color:var(--txt);font-weight:600}
  .n-sw{width:26px;height:26px;border-radius:50%}
  .n-mini{display:flex;gap:3px;align-items:flex-end;height:18px}
  .n-mini i{width:5px;height:16px;border-radius:2px;background:#cdbba3;display:block}
  .n-opt.on .n-mini i{background:var(--cafe)}
  .n-stp{height:56px;border-width:1.5px;border-radius:14px;padding:0 6px}
  .n-stp button{width:44px;height:44px;background:#fbf3e6;color:var(--cafe);border-radius:12px;font-size:20px}
  .n-stp button:disabled{opacity:.4;cursor:default}
  .n-stp span{font-size:20px}
  .n-tg{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:18px;min-height:48px;border:none;background:none;padding:0;font-size:16px;color:var(--txt);font-weight:600;cursor:pointer;font-family:inherit}
  .n-sw2{width:50px;height:30px;border-radius:15px;background:#d9cfc2;position:relative;transition:background 180ms ease;flex-shrink:0}
  .n-sw2::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform 180ms var(--ease-out)}
  .n-tg[aria-checked="true"] .n-sw2{background:var(--cafe)}
  .n-tg[aria-checked="true"] .n-sw2::after{transform:translateX(20px)}
  .n-tg + .f-lbl{display:none}
  .sheet .f-dd{border-width:1.5px;margin-top:10px}
  .n-go{height:52px;font-size:16px;font-weight:600;border-radius:14px;margin-top:18px!important}
  @media (min-width:700px){
    .sheet-panel{top:50%;bottom:auto;max-height:88vh;border-radius:22px;overflow:auto;transform:translateY(-46%) scale(.98);opacity:0;transition:transform 260ms var(--ease-out),opacity 200ms ease;width:min(520px,92vw)}
    .sheet.open .sheet-panel{transform:translateY(-50%);opacity:1}
    .sheet-hdr{border-radius:22px 22px 0 0} .sheet-asa{display:none}
  }
  .in{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);padding:0 14px;font-size:16px;color:var(--txt);background:#fff;font-family:inherit}
  .in:focus{outline:2px solid var(--acc);outline-offset:1px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg2{grid-template-columns:1fr 1fr!important}
  .stp{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line2);border-radius:12px;height:46px;padding:0 3px;background:#fff}
  .stp button{width:40px;height:38px;border:none;background:#f1ece4;border-radius:9px;font-size:19px;color:var(--txt);cursor:pointer}
  .stp span{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
  body.sin-scroll{overflow:hidden}
  @media (prefers-reduced-motion: reduce){ .sheet-panel{transform:none!important;opacity:0;transition:opacity 200ms} .sheet.open .sheet-panel{opacity:1} .toast{transform:translate(-50%,0)!important} body.toast-on .fab{transform:none} }
  @media (prefers-reduced-motion: reduce) and (min-width:700px){ .sheet-panel{transform:translateY(-50%)!important} }
  .buscar{position:relative;margin-bottom:10px}
  .buscar input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 40px 0 38px;font-size:16px;color:var(--txt);font-family:inherit}
  .buscar input:focus{outline:2px solid var(--acc);outline-offset:1px}
  .buscar .ti-search{position:absolute;left:12px;top:12px;font-size:18px;color:var(--muted)}
  .buscar button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:none;background:none;font-size:18px;color:var(--txt2);cursor:pointer;display:none}
  .buscar.lleno button{display:block}
  .confirma{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}
  .confirma .acc{display:flex;gap:8px;margin-top:8px}
  .confirma .btn{margin-top:0;flex:1}
  .login{max-width:340px;margin:12vh auto 0;text-align:center}
  .login h2{font-size:18px;margin:0 0 6px}
  .login p{color:var(--txt2);font-size:14px;margin:0 0 16px}
  .login input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);padding:0 14px;font-size:16px;font-family:inherit;margin-bottom:10px}
  .login .err{color:var(--rojo);font-size:13px;min-height:18px;margin-bottom:6px}
  @media (min-width:900px){ nav{grid-template-columns:repeat(2,180px);justify-content:center} }
  /* ---- Paquetes: pestañas + lista compacta con velitas ---- */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:#ebe5db;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
  .seg button{height:40px;border:none;border-radius:9px;background:transparent;font-size:14px;color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .seg button:active{transform:scale(.97)}
  .seg button.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 2px rgba(43,38,34,.08)}
  .seg button{white-space:nowrap;padding:0 4px}
  @media (max-width:360px){ .seg button{font-size:12.5px;gap:4px} }
  .seg .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
  .seg button.on .n{color:var(--cafe)}
  .lbl{font-size:12px;color:var(--muted);margin:14px 2px 6px}
  .lbl:first-child{margin-top:2px}
  .lista{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rw{border-top:1px solid var(--line)}
  .rw:first-child{border-top:none}
  .rh{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;min-height:64px;border:none;border-radius:0;background:none;text-align:left;color:var(--txt);font-size:15px;cursor:pointer}
  .rh:active{transform:none;background:#faf7f2}
  .vel{display:flex;gap:3px;align-items:flex-end;height:26px;width:67px}
  .vel span{width:7px;height:20px;border-radius:2px 2px 3px 3px;position:relative;flex-shrink:0}
  .vel span::before{content:"";position:absolute;left:50%;top:-5px;width:1.5px;height:4px;background:#8b7d6b;transform:translateX(-50%);border-radius:1px}
  .vel span.m{background:transparent!important;border:1.5px dashed var(--amb)}
  .vel span.g{background:#e6e1d8}
  .who{min-width:0}
  .who b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{font-size:12px;color:var(--txt2)}
  .stt{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
  .stt .ok{color:var(--ok);display:flex;align-items:center;gap:4px}
  .stt .f{color:var(--warn)} .stt .g{color:var(--muted)}
  .stt .chev{color:var(--muted);font-size:16px;transition:transform 200ms var(--ease-out)}
  .rw.open .chev{transform:rotate(180deg)}
  .det{padding:0 12px 14px}
  .cols{display:grid;gap:10px;margin:2px 0 12px}
  .col h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:6px}
  .col ul{list-style:none;margin:0;padding:0}
  .col li{font-size:14px;padding:3px 0;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
  .col li.m{color:var(--warn)}
  .col li.m::after{content:"falta";font-size:11px;border:1px dashed var(--amb);border-radius:6px;padding:0 5px}
  .det .btn{margin-top:0}
  .det .aviso{margin:0 0 10px}
  .det .confirma{margin-top:0}
  .nota-prev{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:10px}
  .nota-prev i{font-size:18px;margin-top:1px}
  .nota-prev b{font-weight:600}
  .f-lbl{font-size:13px;color:var(--txt2);margin:14px 0 8px}
  .f-lbl:first-child{margin-top:2px}
  .f-seg{margin-bottom:0}
  .f-dd{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff}
  .f-dd-btn{width:100%;min-height:50px;border:none;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:16px;color:var(--txt);text-align:left;cursor:pointer}
  .f-dd-btn:active{transform:none;background:#faf7f2}
  .f-dd-btn i{font-size:18px;color:var(--txt2);transition:transform 200ms var(--ease-out)}
  .f-dd.open .f-dd-btn i{transform:rotate(180deg)}
  .f-ph{color:var(--muted)}
  .f-opts{border-top:1px solid var(--line)}
  .f-op{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;font-size:16px;color:var(--txt);border-bottom:1px solid #f1ece4;cursor:pointer}
  .f-op input{width:20px;height:20px;accent-color:var(--cafe);margin:0}
  .f-op.off{color:#bdb4a7;cursor:default}
  .f-cnt{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#faf7f2;font-size:13px;color:var(--txt2)}
  .f-cnt b{color:var(--txt);font-weight:600}
  .f-cnt button{border:none;background:var(--cafe);color:#fff;border-radius:8px;height:36px;padding:0 16px;font-size:14px;cursor:pointer}
  .f-prev{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#faf7f2;border:1px solid var(--line);border-radius:12px;padding:12px}
  .f-prev h4{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:6px}
  .f-prev ul{margin:0;padding:0}.f-prev li{list-style:none;padding:2px 0;font-size:15px}
  .f-prev li button{border:none;background:none;padding:4px 0;font-size:15px;color:var(--txt);text-decoration:underline dotted;text-underline-offset:3px;text-align:left;cursor:pointer}
  .f-vac{color:var(--muted)}
  .f-why{font-size:13px;color:var(--txt2);margin-top:8px;line-height:1.45}
  .det .f-why + .btn, .det .f-dd + .btn{margin-top:14px}
  .f-hint{font-size:13px;color:var(--txt2);text-align:center;margin-top:8px}
  .btn:disabled{background:#d9cfc2;border-color:#d9cfc2;cursor:default}
  .armado-el{font-size:12px;color:var(--txt2);display:flex;justify-content:space-between;align-items:center}
  @media (prefers-reduced-motion: reduce){ *{transition-property:opacity!important} button:active{transform:none!important} }

  /* ===== Sistema de botones: un solo radio, alturas y estilos para toda la app ===== */
  :root{ --r-btn:12px; }
  .btn,.st button,.toast button,.f-cnt button,.stp button,.n-stp button,.sheet-x,.fab,.n-opt,.buscar button,.armado-el .btn{border-radius:var(--r-btn)}
  .seg{border-radius:var(--r-btn)} .seg button{border-radius:calc(var(--r-btn) - 3px)}   /* concéntrico dentro del selector */
  .btn{min-height:48px;padding:0 16px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line2);background:#fff;color:var(--txt);transition:transform 120ms var(--ease-out),background 150ms ease,border-color 150ms ease}
  .btn.main{background:var(--cafe);border-color:var(--cafe);color:#fff}
  .btn:disabled{background:#e4dbcf;border-color:#e4dbcf;color:#fff}
  .btn.link{width:auto;min-height:40px;margin-top:0;padding:0 14px;font-size:14px;text-decoration:none;border:1.5px solid var(--line2);background:#fff;color:var(--txt)}
  .sheet-x{height:40px;padding:0 16px;font-size:14px;font-weight:600;text-decoration:none;color:#fff;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);transition:transform 120ms var(--ease-out),background 150ms ease}
  .sheet-x:active{background:rgba(255,255,255,.2)}
  .f-cnt button{height:40px;padding:0 18px;font-weight:600}
  .toast button{height:38px}
  .confirma .btn{min-height:44px}
  .armado-el .btn{flex:none}
  @media (hover:hover) and (pointer:fine){
    .btn:not(:disabled):hover{border-color:var(--line2);background:#faf7f2}
    .btn.main:not(:disabled):hover{background:#6c4427;border-color:#6c4427}
    .sheet-x:hover{background:rgba(255,255,255,.18)}
  }
  /* Botón de armar: pequeño, con borde café y alineado a la derecha */
  .det .btn-armar{width:auto;min-height:40px;margin:2px 0 0 auto;padding:0 16px;font-size:14px;border:1.5px solid var(--cafe);background:#fff;color:var(--cafe)}
  .det .btn-armar.igual{border-color:var(--line2);color:var(--txt)}
  @media (hover:hover) and (pointer:fine){ .det .btn-armar:hover{background:#fbf3e6} }
  .stt .ent{color:var(--txt2);display:flex;align-items:center;gap:4px}
  .armado-el{flex-wrap:wrap;gap:8px}
  .acc-r{display:flex;gap:8px;margin-left:auto}
  .armado-el > .btn{margin-left:auto}
  .acc-r .btn{margin:0}
  .nota-prev p{margin:0}
  .nota-prev ol{margin:6px 0;padding-left:20px}
  .nota-prev li{margin:2px 0}
  /* Más aire entre secciones de la hoja Nuevo paquete */
  .sheet-body #nDyn .n-lbl, .sheet-body #nDyn > .f-lbl{margin-top:22px}
  .sheet-body label.n-lbl{margin-top:4px}
  .sheet-body .n-tg{margin-top:22px}
</style>
</head>
<body>
<header><i class="ti ti-flame" aria-hidden="true"></i><h1 id="titulo">Velas</h1>
  <button class="estado saving" id="estado" aria-live="polite" disabled><i></i><span>Cargando…</span></button></header>
<div class="toast" id="toast" role="status" aria-live="polite"><i class="t-ic ti ti-info-circle" aria-hidden="true"></i><span class="t-txt"><b class="t-tit"></b><small class="t-det"></small></span><button type="button"></button></div>
<button class="fab" id="fab" aria-label="Nuevo paquete" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-fondo" data-cerrar></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="nTit">
    <div class="sheet-hdr">
      <div class="sheet-asa" aria-hidden="true"></div>
      <div class="sheet-top"><h2 id="nTit">Nuevo paquete</h2><button type="button" class="sheet-x" data-cerrar>Cancelar</button></div>
      <div class="n-prev" aria-live="polite"><div class="n-vel" id="nVel" aria-hidden="true"></div><div class="n-pt"><b id="nPt1"></b><span id="nPt2"></span></div></div>
    </div>
    <div class="sheet-body">
      <div data-form="nuevo">
        <label class="f-lbl n-lbl" for="nNombre">Nombre del comprador</label>
        <input id="nNombre" class="in" type="text" placeholder="Nombre comprador" autocomplete="off" autocapitalize="words" enterkeyhint="done">
        <div id="nDyn"></div>
      </div>
      <button type="button" class="btn main n-go" id="nGuardar" disabled><i class="ti ti-plus" aria-hidden="true"></i> Agregar paquete</button>
      <div class="f-hint" id="nHint"></div>
    </div>
  </div>
</div>

<main>
  <section id="vVelas">
    <div class="metrics">
      <div class="mt"><small><span class="dot" style="background:var(--rojo);margin-right:4px"></span>Rojas por hacer</small><b id="mR">–</b></div>
      <div class="mt"><small><span class="dot" style="background:var(--verde);margin-right:4px"></span>Verdes por hacer</small><b id="mV">–</b></div>
    </div>
    <div class="box" id="inv"><div class="vacio">Cargando…</div></div>
  </section>

  <section id="vPaq" style="display:none">
    <div class="buscar" id="buscarBox"><i class="ti ti-search" aria-hidden="true"></i>
      <input id="buscar" type="search" placeholder="Buscar persona" aria-label="Buscar persona" autocomplete="off" enterkeyhint="search">
      <button id="limpiar" aria-label="Borrar búsqueda"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="seg" id="seg" role="tablist" aria-label="Estado de los paquetes">
      <button role="tab" data-t="p" class="on" aria-selected="true">Por armar <span class="n" id="nTp"></span></button>
      <button role="tab" data-t="s" aria-selected="false">Sin deseos <span class="n" id="nTs"></span></button>
      <button role="tab" data-t="a" aria-selected="false">Armados <span class="n" id="nTa"></span></button>
    </div>
    <div id="paq"></div>
  </section>
</main>

<nav>
  <button id="nV" class="on" aria-current="page" onclick="ir('V')"><i class="ti ti-candle" aria-hidden="true"></i>Velas</button>
  <button id="nP" onclick="ir('P')"><i class="ti ti-gift" aria-hidden="true"></i>Paquetes</button>
</nav>

<script>
  // Pega aquí la URL de la implementación de Apps Script (termina en /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbxR78fYlMFVxsF02a2nCGyX0kflkbQjt5jiewfX7H-_T_QcnU0vtSj3XKH0l8qPIfXs-g/exec';

  // Clave sencilla: se pide una vez y queda guardada en este celular
  const guardada = { get(){ try { return localStorage.getItem('velasClave') || ''; } catch(e){ return ''; } },
                     set(v){ try { localStorage.setItem('velasClave', v); } catch(e){} } };
  let CLAVE = guardada.get();

  async function api(action, params) {
    let res;
    if (action === 'getData') {
      res = await fetch(API_URL + '?action=getData&clave=' + encodeURIComponent(CLAVE) + '&t=' + Date.now());
    } else {
      // text/plain evita el bloqueo CORS de Apps Script
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                   body: JSON.stringify(Object.assign({ action, clave: CLAVE }, params)) });
    }
    const json = await res.json();
    if (!json.ok) {
      if (json.error === 'CLAVE') { pedirClave(); throw new Error('Falta la clave'); }
      throw new Error(json.error || 'Error desconocido');
    }
    return json.data;
  }

  function pedirClave(malo) {
    const m = document.querySelector('main'), n = document.querySelector('nav');
    n.style.display = 'none';
    m.innerHTML = `<div class="login"><h2>Velas de deseos</h2><p>Escribe la clave para entrar. Solo se pide una vez en este celular.</p>
      <form id="fClave"><input id="iClave" type="password" autocomplete="current-password" aria-label="Clave" placeholder="Clave" enterkeyhint="go">
      <div class="err" id="eClave">${malo ? 'Esa clave no es. Intenta de nuevo.' : ''}</div><button class="btn main" type="submit">Entrar</button></form></div>`;
    document.getElementById('fClave').addEventListener('submit', ev => {
      ev.preventDefault(); const v = document.getElementById('iClave').value.trim(); if (!v) return;
      CLAVE = v; guardada.set(v); location.reload();
    });
    if (CLAVE) document.getElementById('eClave').textContent = 'Esa clave no es. Intenta de nuevo.';
    setTimeout(() => document.getElementById('iClave').focus(), 50);
  }

  let D = { paquetes: [], inventario: [], deseos: [] };
  let pestana = 'p', abierto = null;
  const COLS = [ { k:'rojas', color:'Rojo', lbl:'Rojas', cls:'lbl-r', txt:'roja' },
                 { k:'verdes', color:'Verde', lbl:'Verdes', cls:'lbl-v', txt:'verde' },
                 { k:'rosadas', color:'Rosado', lbl:'Rosada', cls:'lbl-p', txt:'rosada' } ];
  // Compara deseos sin tildes ni mayúsculas: "Union" y "unión" son el mismo deseo
  const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  const key = (d, c) => norm(d) + '|' + norm(c);
  let busqueda = '', confirmId = null, fijos = {};
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  let cargado = false, falloInicial = false;
  function cargar() {
    if (API_URL.startsWith('PEGA')) { document.getElementById('inv').innerHTML = '<div class="vacio">Falta poner la URL de Apps Script en API_URL.</div>'; return; }
    api('getData').then(d => { cargado = true; falloInicial = false; recibir(d); estado(); }).catch(e => {
      if (e && e.message === 'Falta la clave') return;
      if (!cargado) falloCarga(); else error(e);
    });
  }
  // Si la primera carga falla, se muestra en pantalla con un botón para reintentar
  function falloCarga() {
    falloInicial = true;
    const msg = `<div class="vacio">No se pudo cargar la información.<br>Revisa la conexión e intenta de nuevo.
      <button class="btn main" data-reintentar style="max-width:220px;margin:14px auto 0;display:block">Reintentar</button></div>`;
    document.getElementById('inv').innerHTML = msg;
    document.getElementById('paq').innerHTML = msg;
    estado();
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-reintentar]')) return;
    document.getElementById('inv').innerHTML = document.getElementById('paq').innerHTML = '<div class="vacio">Cargando…</div>';
    falloInicial = false; estado(); cargar();
  });
  function error(e) { ocupado(false); const m = e && e.message ? e.message : String(e); if (m !== 'Falta la clave') aviso('Algo falló: ' + m); }

  // Estado de guardado arriba a la derecha: guardado / guardando / error (toca para reintentar)
  let enVuelo = 0;
  function ocupado(on) { enVuelo = Math.max(0, enVuelo + (on ? 1 : -1)); estado(); }
  function estado(err) {
    const el = document.getElementById('estado');
    const guardando = enVuelo > 0 || Object.keys(pendientes).length > 0;
    const sinDatos = !cargado;
    el.className = 'estado' + (err ? ' err' : (guardando || sinDatos) ? ' saving' : '');
    el.querySelector('span').textContent = err ? 'No se guardó · Reintentar' : guardando ? 'Guardando…' : sinDatos ? (falloInicial ? 'Sin conexión' : 'Cargando…') : 'Guardado';
    el.disabled = !err;
  }
  document.getElementById('estado').addEventListener('click', () => {
    if (document.getElementById('estado').classList.contains('err')) enviarCambios();
  });
  // Avisos en cola: uno a la vez, con título, detalle opcional y una acción (Deshacer, Ver)
  const colaAvisos = []; let avisoActivo = false;
  function aviso(t, accion, fn) { avisoRico({ titulo: t, accion, fn }); }
  function avisoRico(o) {
    if (o.ver && !o.accion) { o.accion = 'Ver'; o.fn = () => verPaquete(o.ver); }
    colaAvisos.push(o);
    if (!avisoActivo) siguienteAviso();
    else { const el = document.getElementById('toast'); clearTimeout(el._t); el._t = setTimeout(el._cerrar, 1200); }   // si llega otro, el actual se acorta
  }
  function siguienteAviso() {
    const o = colaAvisos.shift(); const el = document.getElementById('toast');
    if (!o) { avisoActivo = false; document.body.classList.remove('toast-on'); return; }
    avisoActivo = true;
    el.className = 'toast ' + (o.tipo || '');
    el.querySelector('.t-tit').textContent = o.titulo;
    el.querySelector('.t-det').textContent = o.detalle || '';
    const b = el.querySelector('button'); b.textContent = o.accion || '';
    const ic = el.querySelector('.t-ic'); ic.className = 't-ic ti ' + (o.tipo === 'ok' ? 'ti-circle-check' : o.tipo === 'listo' ? 'ti-gift' : 'ti-info-circle');
    const cerrar = () => { clearTimeout(el._t); el.classList.remove('show'); setTimeout(siguienteAviso, 220); };
    el._cerrar = cerrar;
    b.onclick = () => { cerrar(); o.fn && o.fn(); };
    requestAnimationFrame(() => { el.classList.add('show'); document.body.classList.add('toast-on'); });
    el._t = setTimeout(cerrar, o.accion ? 6000 : 3500);
  }
  function verPaquete(id) {
    const p = D.paquetes.find(x => x.id === id); if (!p) return;
    ir('P');
    const t = (p.estado === 'Armado' || p.estado === 'Entregado') ? 'a' : p.estado === 'Esperando deseos' ? 's' : 'p';
    const b = document.querySelector(`#seg button[data-t="${t}"]`); if (b) b.click();
    abierto = id; pintar(D);
    const r = document.querySelector(`.rh[data-id="${CSS.escape(id)}"]`); if (r) r.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  // Paquetes que quedan listos después de un cambio (sumar velas, deshacer, etc.)
  let listosAntes = null; const silencio = new Set();
  function silenciar(id) { silencio.add(id); }
  function revisarListos() {
    const ahora = new Set(D.paquetes.filter(p => p.estado === 'Pendiente' && !faltan(p)).map(p => p.id));
    if (listosAntes && cargado) {
      const nuevos = [...ahora].filter(id => !listosAntes.has(id) && !silencio.has(id));
      if (nuevos.length) {
        const ps = nuevos.map(id => D.paquetes.find(p => p.id === id));
        const nombres = ps.map(p => p.persona + (/^1 de 1$/.test(p.numero) ? '' : ` (${p.numero})`));
        avisoRico(nuevos.length === 1
          ? { titulo: `${nombres[0]}: listo para armar`, detalle: 'Ya tiene todas sus velas en el inventario', tipo: 'listo', ver: nuevos[0] }
          : { titulo: `${nuevos.length} paquetes listos para armar`, detalle: nombres.slice(0, 3).join(', ') + (nombres.length > 3 ? ' y más' : ''), tipo: 'listo', accion: 'Ver', fn: () => verPaquete(nuevos[0]) });
      }
    }
    silencio.clear(); listosAntes = ahora;
  }

  function stockMap() { const m = {}; D.inventario.forEach(r => m[key(r.deseo, r.color)] = { deseo:r.deseo, color:r.color, n:r.hechas }); return m; }
  // Velas previstas: lo que creen que pedirán quienes aún no eligen deseos
  function previstasMap() { const m = {}; (D.previstas || []).forEach(r => { const k = key(r.deseo, r.color); m[k] = (m[k] || 0) + r.cantidad; }); return m; }
  function necesarioMap() {
    const m = previstasMap();
    D.paquetes.filter(p => p.estado === 'Pendiente').forEach(p =>
      COLS.forEach(c => p[c.k].forEach(d => { const k = key(d, c.color); m[k] = (m[k] || 0) + 1; })));
    return m;
  }


  // Recibe datos del servidor y vuelve a aplicar encima los toques que todavía no se han enviado
  function recibir(data) {
    D = data;
    Object.values(pendientes).forEach(p => aplicarLocal(p.deseo, p.color, p.delta));
    pintar(D);
  }

  function pintar(data) {
    D = data;
    const st = stockMap(), nec = necesarioMap(), prev = previstasMap();
    asignar(st);
    revisarListos();

    // Lista de deseos: los de la pestaña Deseos + cualquiera que aparezca en paquetes o inventario
    const orden = [...D.deseos];
    const add = d => { if (!orden.some(x => norm(x) === norm(d))) orden.push(d); };
    D.inventario.forEach(r => add(r.deseo));
    D.paquetes.forEach(p => COLS.forEach(c => p[c.k].forEach(add)));

    // Pantalla Velas: cada deseo con su línea roja y verde (y rosada si se pidió), "hechas de necesarias"
    const COLOR_UI = { Rojo:{ lbl:'Roja', dot:'var(--rojo)' }, Verde:{ lbl:'Verde', dot:'var(--verde)' }, Rosado:{ lbl:'Rosada', dot:'var(--rosa)' } };
    let fr = 0, fv = 0;
    const linea = (d, color) => {
      const k = key(d, color), h = st[k] ? st[k].n : 0, n = nec[k] || 0, f = Math.max(0, n - h);
      if (color === 'Rojo') fr += f; if (color === 'Verde') fv += f;
      const pct = n ? Math.min(100, Math.round(h / n * 100)) : 0;
      const pv = prev[k] || 0, pvTxt = pv ? ` · ${pv} prevista${pv > 1 ? 's' : ''}` : '';
      const txt = n ? (f ? `<span class="f">Faltan <b>${f}</b></span> de ${n}${pvTxt}` : `<span class="ok">Listas las ${n}${h > n ? ` · +${h - n}` : ''}</span>${pvTxt}`)
                    : `<span class="na">Sin pedidos${h ? ` · +${h}` : ''}</span>`;
      const nom = `${d} ${COLOR_UI[color].lbl.toLowerCase()}`;
      return { f, html: `<div class="ln">
        <div class="lb"><span class="dot" style="background:${COLOR_UI[color].dot}"></span>${COLOR_UI[color].lbl}</div>
        <div><div class="bar"><i class="${n && !f ? 'full' : ''}" style="width:${pct}%"></i></div><div class="num">${txt}</div></div>
        <div class="st"><button aria-label="Restar ${esc(nom)}" data-d="${esc(d)}" data-c="${color}" data-x="-1">−</button><span>${h}</span><button aria-label="Sumar ${esc(nom)}" data-d="${esc(d)}" data-c="${color}" data-x="1">+</button></div>
      </div>` };
    };
    const bloques = orden.map(d => {
      const cols = ['Rojo', 'Verde'];
      if (nec[key(d,'Rosado')] || st[key(d,'Rosado')]) cols.push('Rosado');
      const ls = cols.map(c => linea(d, c));
      const falta = ls.reduce((s, l) => s + l.f, 0);
      return { falta, html: `<div class="wish ${falta ? '' : 'done'}"><div class="wn">${esc(d)}</div>${ls.map(l => l.html).join('')}</div>` };
    });
    const pendientesD = bloques.filter(b => b.falta), completos = bloques.filter(b => !b.falta);
    document.getElementById('inv').innerHTML =
      (pendientesD.map(b => b.html).join('') + (completos.length ? `<div class="sep">Completos</div>` + completos.map(b => b.html).join('') : ''))
      || '<div class="vacio">No hay deseos todavía.</div>';
    document.getElementById('mR').textContent = fr;
    document.getElementById('mV').textContent = fv;

    // Paquetes: pestañas Por armar / Sin deseos / Armados
    const tabDe = p => (p.estado === 'Armado' || p.estado === 'Entregado') ? 'a' : p.estado === 'Esperando deseos' ? 's' : 'p';
    const enTab = p => (p.id in fijos ? fijos[p.id].tab : tabDe(p));
    ['p','s','a'].forEach(t => document.getElementById('nT' + t).textContent = D.paquetes.filter(p => tabDe(p) === t).length);
    const lista = D.paquetes.filter(p => (!busqueda || norm(p.persona).includes(busqueda)) && enTab(p) === pestana);
    let html = '';
    if (pestana === 'p') {
      const grupo = p => p.id in fijos ? fijos[p.id].r : (faltan(p) ? 1 : 0);
      const L = lista.filter(p => grupo(p) === 0), F = lista.filter(p => grupo(p) === 1);
      if (L.length) html += `<div class="lbl">Listos · ${L.length}</div><div class="lista">${L.map(p => fila(p, st)).join('')}</div>`;
      if (F.length) html += `<div class="lbl">Les faltan velas · ${F.length}</div><div class="lista">${F.map(p => fila(p, st)).join('')}</div>`;
    } else if (pestana === 'a') {
      // Armados: primero los que faltan por entregar, luego los entregados
      const grupoA = p => p.id in fijos ? fijos[p.id].r : (p.estado === 'Entregado' ? 1 : 0);
      const PE = lista.filter(p => grupoA(p) === 0), EN = lista.filter(p => grupoA(p) === 1);
      if (PE.length) html += `<div class="lbl">Por entregar · ${PE.length}</div><div class="lista">${PE.map(p => fila(p, st)).join('')}</div>`;
      if (EN.length) html += `<div class="lbl">Entregados · ${EN.length}</div><div class="lista">${EN.map(p => fila(p, st)).join('')}</div>`;
    } else if (lista.length) html = `<div class="lista">${lista.map(p => fila(p, st)).join('')}</div>`;
    // Recordatorio de previstas en la pestaña Sin deseos
    const totPrev = (D.previstas || []).reduce((a, r) => a + r.cantidad, 0);
    if (pestana === 's' && totPrev && !busqueda)
      html = `<div class="nota-prev"><i class="ti ti-info-circle" aria-hidden="true"></i><div><p>Estas personas aún no eligen deseos, pero ya contamos <b>${totPrev} velas previstas</b> para ellas. Cuando te digan sus deseos:</p>
        <ol><li>Toca su nombre.</li><li>Elige el color del paquete, si aún no lo tiene.</li><li>Marca sus deseos y toca <b>Guardar deseos</b>.</li></ol>
        <p>Y listo. La app se encarga del resto.</p></div></div>` + html;
    document.getElementById('paq').innerHTML = html || `<div class="vacio">${busqueda ? 'Nadie con ese nombre.' :
      pestana === 'p' ? 'No hay paquetes por armar.' : pestana === 's' ? 'Todos ya eligieron sus deseos.' : 'Todavía no hay paquetes armados.'}</div>`;
  }

  function soltarFijos() { fijos = {}; confirmId = null; }

  // Qué velas del paquete tiene el inventario: marca una por una las que faltan
  // Reparte el inventario entre los paquetes pendientes para que dos paquetes no "usen" la misma vela.
  // 1) En el orden de la hoja, a cada paquete que se puede completar con lo que queda se le apartan sus velas (Listo).
  // 2) A los demás se les reparte lo que sobra, en el mismo orden, y se marca lo que les falta.
  let asignacion = {}, sobrante = {};
  function asignar(st) {
    const disp = {}; Object.keys(st).forEach(k => disp[k] = st[k].n);
    const res = {}, pend = D.paquetes.filter(p => p.estado === 'Pendiente');
    const pide = p => { const m = {}; COLS.forEach(c => p[c.k].forEach(d => { const k = key(d, c.color); m[k] = (m[k] || 0) + 1; })); return m; };
    const resto = [];
    pend.forEach(p => {
      const m = pide(p);
      if (Object.keys(m).every(k => (disp[k] || 0) >= m[k])) {
        Object.keys(m).forEach(k => disp[k] -= m[k]);
        res[p.id] = COLS.flatMap(c => p[c.k].map(d => ({ d, c, falta: false, apartada: false })));
      } else resto.push(p);
    });
    resto.forEach(p => {
      res[p.id] = COLS.flatMap(c => p[c.k].map(d => {
        const k = key(d, c.color);
        if ((disp[k] || 0) > 0) { disp[k]--; return { d, c, falta: false, apartada: false }; }
        return { d, c, falta: true, apartada: (st[k] ? st[k].n : 0) > 0 };   // hay en inventario pero ya está apartada
      }));
    });
    asignacion = res; sobrante = disp;
  }
  function faltan(p) { return (asignacion[p.id] || []).filter(v => v.falta).length; }
  function velasDe(p) {
    if (p.estado === 'Pendiente' && asignacion[p.id]) return asignacion[p.id];
    return COLS.flatMap(c => p[c.k].map(d => ({ d, c, falta: false, apartada: false })));
  }
  const COLOR_VELA = { Rojo:'var(--rojo)', Verde:'var(--verde)', Rosado:'var(--rosa)' };

  function fila(p, st) {
    const varios = !/^1 de 1$/.test(String(p.numero).trim());
    const sub = [varios ? 'Paquete ' + esc(p.numero) : '', esc(p.color)].filter(Boolean).join(' · ');
    const esp = p.estado === 'Esperando deseos', ent = p.estado === 'Entregado', arm = p.estado === 'Armado' || ent;
    const vs = esp ? [] : velasDe(p), nf = vs.filter(v => v.falta).length;
    const velitas = esp
      ? Array.from({ length: p.tamano || 0 }, () => '<span class="g"></span>').join('')
      : vs.map(v => `<span class="${v.falta ? 'm' : ''}" style="background:${COLOR_VELA[v.c.color]}"></span>`).join('');
    const estadoTxt = ent ? '<span class="ent"><i class="ti ti-gift" aria-hidden="true"></i>Entregado</span>'
      : arm ? '<span class="ok"><i class="ti ti-check" aria-hidden="true"></i>Armado</span>'
      : esp ? `<span class="g">Escribir deseos</span>`
      : nf ? `<span class="f">Faltan ${nf}</span>` : '<span class="ok"><i class="ti ti-circle-check" aria-hidden="true"></i>Listo</span>';
    const abre = abierto === p.id;
    const cab = `<button class="rh" data-acc="abrir" data-id="${esc(p.id)}" aria-expanded="${abre}">
        <span class="vel" aria-hidden="true">${velitas}</span>
        <span class="who"><b>${esc(p.persona)}</b><small>${sub}</small></span>
        <span class="stt">${estadoTxt}<i class="ti ti-chevron-down chev" aria-hidden="true"></i></span></button>`;
    if (!abre) return `<div class="rw">${cab}</div>`;
    if (esp) return `<div class="rw open">${cab}<div class="det">${formulario(p)}</div></div>`;

    const columna = (c, t) => { const l = vs.filter(v => v.c === c); return l.length ? `<div class="col"><h4><span class="dot" style="background:${COLOR_VELA[c.color]}"></span>${t}</h4><ul>${l.map(v => `<li class="${v.falta ? 'm' : ''}">${esc(v.d)}</li>`).join('')}</ul></div>` : ''; };
    const cols = [columna(COLS[0], 'Rojas'), columna(COLS[1], 'Verdes'), columna(COLS[2], 'Rosada')].filter(Boolean);
    const total = vs.length;
    const nAp = vs.filter(v => v.apartada).length;
    const apartadas = nAp ? `<div class="aviso">${nAp === 1 ? 'Una vela que falta sí está' : nAp + ' velas que faltan sí están'} en el inventario, pero apartada${nAp === 1 ? '' : 's'} para otros paquetes de la lista.</div>` : '';
    const cuenta = total !== p.tamano ? `<div class="aviso">Tiene ${total} deseos y el paquete es de ${p.tamano}. Revisa la hoja.</div>` : '';
    const conocidos = new Set(D.deseos.map(norm));
    const raros = D.deseos.length ? [...new Set(vs.map(v => v.d).filter(d => !conocidos.has(norm(d))))] : [];
    const revisar = raros.length ? `<div class="aviso">Revisa en la hoja: ${raros.map(d => '"' + esc(d) + '"').join(', ')} no está en la lista de deseos.</div>` : '';
    let acc;
    const COLTXT = { rojo:'roja', verde:'verde', rosado:'rosada' };
    const sinInv = (p.sinInventario || []).map(x => `${esc(x.deseo)} ${COLTXT[norm(x.color)] || esc(x.color)}`);
    const avisoSinInv = arm && sinInv.length ? `<div class="aviso">Se armó sin que estas velas estuvieran en el inventario: ${sinInv.join(', ')}.</div>` : '';
    if (ent) acc = avisoSinInv + `<div class="armado-el"><span>Armado el ${esc(p.fecha)} · entregado el ${esc(p.fechaEntrega || '')}</span><button class="btn link" data-acc="desentregar" data-id="${esc(p.id)}">Deshacer entrega</button></div>`;
    else if (arm) acc = avisoSinInv + `<div class="armado-el"><span>Armado el ${esc(p.fecha)}</span><div class="acc-r"><button class="btn link" data-acc="desarmar" data-id="${esc(p.id)}">Deshacer</button><button class="btn btn-armar" data-acc="entregar" data-id="${esc(p.id)}">Entregado</button></div></div>`;
    else if (confirmId === p.id) acc = `<div class="confirma">Le faltan ${nf} velas en el inventario. ¿Lo marcas como armado igual?
        <div class="acc"><button class="btn" data-acc="cancelar">Cancelar</button><button class="btn main" data-acc="armarYa" data-id="${esc(p.id)}">Sí, armar</button></div></div>`;
    else if (nf) acc = `<button class="btn btn-armar igual" data-acc="armar" data-id="${esc(p.id)}" data-falta="1">Armar igual</button>`;
    else acc = `<button class="btn btn-armar" data-acc="armar" data-id="${esc(p.id)}" data-falta="0">Marcar como armado</button>`;
    return `<div class="rw open">${cab}<div class="det"><div class="cols" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.join('')}</div>${cuenta}${revisar}${apartadas}${acc}</div></div>`;
  }

  // ---- Elegir deseos (mismo componente en "Sin deseos" y en "Nuevo paquete"); la app decide rojas y verdes ----
  // ctx = {key, N, color, sel:[], swap:{}, lista:false, persona, excluir}
  let forms = { sin: null, nuevo: null };
  const colorValido = c => ['Mixto', 'Rojo', 'Verde'].includes(c) ? c : 'Mixto';
  function abrirFormSin(p) {
    forms.sin = { key: 'sin', id: p.id, N: p.tamano, color: colorValido(p.color), sel: [], swap: {}, lista: false, persona: p.persona, excluir: p.id };
  }

  // Mitad y mitad en mixtos; prefiere el color que ya hay hecho (sobrante del inventario) y,
  // si la persona tiene otro paquete, pone cada deseo repetido en el color contrario.
  function decidirColores(ctx) {
    const sel = ctx.sel, n = sel.length;
    if (ctx.color === 'Rojo') return sel.map(() => 'R');
    if (ctx.color === 'Verde') return sel.map(() => 'V');
    const hermanos = {};
    D.paquetes.filter(q => q.id !== ctx.excluir && norm(q.persona) === norm(ctx.persona || '')).forEach(q => {
      q.rojas.forEach(d => hermanos[norm(d)] = 'R'); q.verdes.forEach(d => hermanos[norm(d)] = 'V');
    });
    let mejor = 0, mejorPts = -1e9;
    const tamR = [Math.floor(n / 2), Math.ceil(n / 2)];
    for (let mask = 0; mask < (1 << n); mask++) {
      let nr = 0; for (let i = 0; i < n; i++) if (mask & (1 << i)) nr++;
      if (!tamR.includes(nr)) continue;
      let pts = 0; const usa = {};
      for (let i = 0; i < n; i++) {
        const c = (mask & (1 << i)) ? 'R' : 'V', k = key(sel[i], c === 'R' ? 'Rojo' : 'Verde');
        usa[k] = (usa[k] || 0) + 1;
        if ((sobrante[k] || 0) >= usa[k]) pts += 3;
        const h = hermanos[norm(sel[i])]; if (h) pts += h !== c ? 5 : -5;
        pts -= i * 0.001 * (c === 'R' ? 1 : -1);
      }
      if (pts > mejorPts) { mejorPts = pts; mejor = mask; }
    }
    const res = sel.map((_, i) => (mejor & (1 << i)) ? 'R' : 'V');
    Object.keys(ctx.swap).forEach(i => { if (ctx.swap[i] && res[i]) res[i] = res[i] === 'R' ? 'V' : 'R'; });
    return res;
  }

  // Color + lista desplegable con casillas + "Así quedan los colores"
  function deseosUI(ctx, conColor = true) {
    const N = ctx.N, sel = ctx.sel, lleno = sel.length >= N;
    const lista = [...D.deseos].sort((a, b) => a.localeCompare(b, 'es'));
    const segBtn = (c, t) => `<button type="button" class="${ctx.color === c ? 'on' : ''}" data-acc="fcolor" data-c="${c}" aria-pressed="${ctx.color === c}">${t}</button>`;
    let h = conColor ? `<div class="f-lbl">Color del paquete</div><div class="seg f-seg">${segBtn('Mixto','Mixto')}${segBtn('Rojo','Todo rojo')}${segBtn('Verde','Todo verde')}</div>` : '';
    h += `<div class="f-lbl">Deseos que pidió</div>
      <div class="f-dd ${ctx.lista ? 'open' : ''}"><button type="button" class="f-dd-btn" data-acc="fdd" aria-expanded="${ctx.lista}">
        <span class="${sel.length ? '' : 'f-ph'}">${sel.length ? sel.map(esc).join(', ') : 'Elegir deseos…'}</span><i class="ti ti-chevron-down" aria-hidden="true"></i></button>`;
    if (ctx.lista) h += `<div class="f-opts">${lista.map(w => { const on = sel.includes(w), off = lleno && !on;
        return `<label class="f-op ${off ? 'off' : ''}"><input type="checkbox" data-fw="${esc(w)}" ${on ? 'checked' : ''} ${off ? 'disabled' : ''}>${esc(w)}</label>`; }).join('')}
        <div class="f-cnt"><span><b>${sel.length} de ${N}</b> elegidos</span><button type="button" data-acc="fdd">Listo</button></div></div>`;
    h += `</div>`;
    if (sel.length === N) {
      const c = decidirColores(ctx), L = k => sel.map((w, i) => [w, i]).filter(x => c[x[1]] === k);
      const ul = k => `<ul>${L(k).map(([w, i]) => `<li>${ctx.color === 'Mixto' ? `<button type="button" data-acc="fswap" data-i="${i}">${esc(w)}</button>` : esc(w)}</li>`).join('') || '<li class="f-vac">—</li>'}</ul>`;
      const tieneOtro = D.paquetes.some(q => q.id !== ctx.excluir && norm(q.persona) === norm(ctx.persona || ''));
      h += `<div class="f-lbl">${(ctx.cant || 1) > 1 ? 'Así quedan los colores del paquete 1' : 'Así quedan los colores'}</div><div class="f-prev"><div><h4><span class="dot" style="background:var(--rojo)"></span>Rojas</h4>${ul('R')}</div><div><h4><span class="dot" style="background:var(--verde)"></span>Verdes</h4>${ul('V')}</div></div>
        <div class="f-why">${ctx.color === 'Mixto' ? 'Mitad y mitad, priorizando el color que ya tienes hecho' + (tieneOtro ? ' y poniendo en color contrario lo que se repite en su otro paquete' : '') + '. Toca un deseo para cambiarle el color.' : 'Todas las velas van en ' + (ctx.color === 'Rojo' ? 'rojo' : 'verde') + '.'}</div>`;
    }
    return h;
  }

  function formulario(p) {
    if (!forms.sin || forms.sin.id !== p.id) abrirFormSin(p);
    const ctx = forms.sin, N = ctx.N;
    return `<div data-form="sin">${deseosUI(ctx)}
      <button type="button" class="btn main" data-acc="fguardar" ${ctx.sel.length === N ? '' : 'disabled'}>Guardar deseos</button>
      ${ctx.sel.length === N ? '' : `<div class="f-hint">Elige ${N - ctx.sel.length} más</div>`}</div>`;
  }

  async function guardarDeseos(p) {
    const ctx = forms.sin, c = decidirColores(ctx);
    const rojas = ctx.sel.filter((_, i) => c[i] === 'R'), verdes = ctx.sel.filter((_, i) => c[i] === 'V');
    await enviarCambios();
    ocupado(true);
    silenciar(p.id);
    api('guardarDeseos', { id: p.id, color: ctx.color, rojas, verdes }).then(d => {
      ocupado(false); forms.sin = null; abierto = null; recibir(d);
      const q = D.paquetes.find(x => x.id === p.id), f = q ? faltan(q) : 0;
      avisoRico({ titulo: `Deseos de ${p.persona} guardados`,
        detalle: `${rojas.length} roja${rojas.length === 1 ? '' : 's'} y ${verdes.length} verde${verdes.length === 1 ? '' : 's'} · ${f ? `le falta${f === 1 ? '' : 'n'} ${f} vela${f === 1 ? '' : 's'}` : 'listo para armar'}`,
        tipo: f ? 'info' : 'ok', ver: p.id });
    }).catch(error);
  }

  // ---- Nuevo paquete: botón flotante + hoja inferior ----
  function abrirNuevo() {
    forms.nuevo = { key: 'nuevo', N: 7, cant: 1, color: 'Mixto', modo: 'ya', sel: [], swap: {}, lista: false, persona: '', excluir: null };
    document.getElementById('nNombre').value = '';
    pintarNuevo();
    const sh = document.getElementById('sheet');
    sh.hidden = false; requestAnimationFrame(() => sh.classList.add('open'));
    document.body.classList.add('sin-scroll');
    document.querySelector('main').setAttribute('inert', ''); document.querySelector('nav').setAttribute('inert', '');
    setTimeout(() => document.getElementById('nNombre').focus(), 250);
  }
  function cerrarNuevo() {
    const sh = document.getElementById('sheet'); sh.classList.remove('open');
    document.body.classList.remove('sin-scroll');
    document.querySelector('main').removeAttribute('inert'); document.querySelector('nav').removeAttribute('inert');
    setTimeout(() => { sh.hidden = true; forms.nuevo = null; }, 260);
    document.getElementById('fab').focus();
  }
  function pintarNuevo() {
    const ctx = forms.nuevo; if (!ctx) return;
    const mini = n => `<span class="n-mini" aria-hidden="true">${'<i></i>'.repeat(n)}</span>`;
    const opt = (acc, v, on, cont, t) => `<button type="button" class="n-opt ${on ? 'on' : ''}" data-acc="${acc}" data-v="${v}" aria-pressed="${on}">${cont}<span>${t}</span></button>`;
    const sw = bg => `<span class="n-sw" style="background:${bg}" aria-hidden="true"></span>`;
    let h = `<div class="f-lbl n-lbl">Tamaño</div><div class="n-opts n-o2">${opt('ntam', 5, ctx.N === 5, mini(5), '5 velas')}${opt('ntam', 7, ctx.N === 7, mini(7), '7 velas')}</div>
      <div class="f-lbl n-lbl">Color</div><div class="n-opts n-o3">
        ${opt('fcolorN', 'Mixto', ctx.color === 'Mixto', sw('linear-gradient(90deg,var(--rojo) 50%,var(--verde) 50%)'), 'Mixto')}
        ${opt('fcolorN', 'Rojo', ctx.color === 'Rojo', sw('var(--rojo)'), 'Todo rojo')}
        ${opt('fcolorN', 'Verde', ctx.color === 'Verde', sw('var(--verde)'), 'Todo verde')}</div>
      <div class="f-lbl n-lbl">Cuántos paquetes</div>
      <div class="stp n-stp"><button type="button" data-acc="ncant" data-v="-1" aria-label="Un paquete menos" ${ctx.cant <= 1 ? 'disabled' : ''}>−</button><span aria-live="polite">${ctx.cant}</span><button type="button" data-acc="ncant" data-v="1" aria-label="Un paquete más">+</button></div>
      <button type="button" class="n-tg" role="switch" aria-checked="${ctx.modo === 'ya'}" data-acc="nmodo" data-v="${ctx.modo === 'ya' ? 'luego' : 'ya'}"><span>Ya sé los deseos</span><span class="n-sw2" aria-hidden="true"></span></button>`;
    if (ctx.modo === 'ya') {
      h += deseosUI(ctx, false);
      if (ctx.cant > 1) h += `<div class="f-why">Los ${ctx.cant} paquetes llevan los mismos deseos; la app pone cada deseo en un color distinto en cada paquete.</div>`;
    } else h += `<div class="f-why">El paquete queda en <b>Sin deseos</b> y los escribes cuando te los digan.</div>`;
    document.getElementById('nDyn').innerHTML = h;
    resumenNuevo();
  }
  // Vista previa del encabezado: las velitas se pintan a medida que eliges
  function resumenNuevo() {
    const ctx = forms.nuevo; if (!ctx) return;
    const nombre = document.getElementById('nNombre').value.trim();
    ctx.persona = nombre;
    const okDeseos = ctx.modo === 'luego' || ctx.sel.length === ctx.N;
    const colorDe = c => c === 'R' ? 'var(--rojo-v)' : 'var(--verde-v)';
    let velas = [];
    if (ctx.modo === 'ya' && ctx.sel.length === ctx.N) velas = decidirColores(ctx).map(c => ({ c: colorDe(c) }));
    else for (let i = 0; i < ctx.N; i++) {
      const lleno = ctx.modo === 'luego' || i < ctx.sel.length;
      const c = ctx.color === 'Rojo' ? 'R' : ctx.color === 'Verde' ? 'V' : (i % 2 ? 'V' : 'R');
      velas.push({ c: lleno ? colorDe(c) : null });
    }
    document.getElementById('nVel').innerHTML = velas.map(v => v.c ? `<span style="background:${v.c}"></span>` : '<span class="e"></span>').join('');
    const pl = ctx.cant > 1;
    document.getElementById('nPt1').textContent = `${pl ? ctx.cant + ' paquetes' : 'Paquete'} de ${ctx.N} velas${nombre ? ' · ' + nombre : ''}`;
    document.getElementById('nPt2').textContent = `${({ Mixto: 'Mixto', Rojo: 'Todo rojo', Verde: 'Todo verde' })[ctx.color]} · ${ctx.modo === 'luego' ? 'deseos después' : okDeseos ? 'deseos completos' : `${ctx.sel.length} de ${ctx.N} deseos`}${pl ? ` · ${ctx.cant * ctx.N} velas` : ''}`;
    const btn = document.getElementById('nGuardar');
    btn.disabled = !nombre || !okDeseos;
    document.getElementById('nHint').textContent = !nombre ? 'Escribe el nombre del comprador' : !okDeseos ? `Elige ${ctx.N - ctx.sel.length} deseos más` : '';
  }
  async function guardarNuevo() {
    const ctx = forms.nuevo; if (!ctx) return;
    const nombre = document.getElementById('nNombre').value.trim(); if (!nombre) return;
    let paquetes = [];
    if (ctx.modo === 'ya') {
      const c1 = decidirColores(ctx);
      for (let k = 0; k < ctx.cant; k++) {
        const c = (k % 2 === 0 || ctx.color !== 'Mixto') ? c1 : c1.map(x => x === 'R' ? 'V' : 'R');
        paquetes.push({ rojas: ctx.sel.filter((_, i) => c[i] === 'R'), verdes: ctx.sel.filter((_, i) => c[i] === 'V') });
      }
    }
    await enviarCambios();
    ocupado(true);
    const antes = new Set(D.paquetes.map(p => p.id));
    api('agregarPaquetes', { persona: nombre, tamano: ctx.N, cantidad: ctx.cant, color: ctx.color, paquetes }).then(d => {
      ocupado(false);
      d.paquetes.filter(p => !antes.has(p.id)).forEach(p => silenciar(p.id));
      const cant = ctx.cant, N = ctx.N, con = ctx.modo === 'ya';
      cerrarNuevo(); recibir(d);
      const nuevos = D.paquetes.filter(p => !antes.has(p.id));
      const listos = nuevos.filter(p => p.estado === 'Pendiente' && !faltan(p)).length;
      avisoRico({ titulo: cant > 1 ? `${cant} paquetes de ${nombre} agregados` : `Paquete de ${nombre} agregado`,
        detalle: `${cant * N} velas · ${con ? (listos === nuevos.length ? 'listo para armar' : listos ? `${listos} listo${listos > 1 ? 's' : ''} para armar` : 'quedó en Por armar') : 'quedó en Sin deseos'}`,
        tipo: 'ok', ver: nuevos[0] && nuevos[0].id });
    }).catch(error);
  }
  document.getElementById('fab').addEventListener('click', abrirNuevo);
  document.getElementById('nNombre').addEventListener('input', resumenNuevo);
  document.getElementById('nGuardar').addEventListener('click', guardarNuevo);
  document.getElementById('sheet').addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) cerrarNuevo(); });
  document.addEventListener('keydown', e => {
    if (!forms.nuevo) return;
    if (e.key === 'Escape') { cerrarNuevo(); return; }
    if (e.key === 'Tab') {   // el foco no sale de la hoja mientras está abierta
      const f = [...document.querySelectorAll('.sheet-panel button:not([disabled]), .sheet-panel input:not([disabled])')].filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
    }
  });

  // Acciones compartidas del selector de deseos (Sin deseos y Nuevo paquete)
  function ctxDe(el) { const f = el.closest('[data-form]'); return f ? forms[f.dataset.form] : null; }
  function repintar(ctx) { if (ctx.key === 'nuevo') pintarNuevo(); else pintar(D); }
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-acc]'); if (!b) return;
    const ctx = ctxDe(b); if (!ctx) return;
    const a = b.dataset.acc;
    if (a === 'fcolor' || a === 'fcolorN') { ctx.color = b.dataset.c || b.dataset.v; ctx.swap = {}; repintar(ctx); }
    else if (a === 'fdd') { ctx.lista = !ctx.lista; repintar(ctx); }
    else if (a === 'fswap') { ctx.swap[b.dataset.i] = !ctx.swap[b.dataset.i]; repintar(ctx); }
    else if (a === 'ntam') { ctx.N = Number(b.dataset.v); ctx.sel = ctx.sel.slice(0, ctx.N); ctx.swap = {}; repintar(ctx); }
    else if (a === 'ncant') { ctx.cant = Math.max(1, Math.min(10, ctx.cant + Number(b.dataset.v))); repintar(ctx); }
    else if (a === 'nmodo') { ctx.modo = b.dataset.v; repintar(ctx); }
    else if (a === 'fguardar') { const p = D.paquetes.find(x => x.id === ctx.id); if (p) guardarDeseos(p); }
  });
  document.addEventListener('change', e => {
    const w = e.target.dataset && e.target.dataset.fw; if (!w) return;
    const ctx = ctxDe(e.target); if (!ctx) return;
    if (e.target.checked) { if (ctx.sel.length < ctx.N) ctx.sel.push(w); }
    else ctx.sel = ctx.sel.filter(x => x !== w);
    ctx.swap = {}; repintar(ctx);
  });

  // ---- Inventario: los toques se juntan y se mandan en un solo envío ----
  let pendientes = {};      // clave → {deseo, color, delta} aún sin enviar
  let timerEnvio = null;
  let enviando = false;

  function aplicarLocal(deseo, color, delta) {
    const k = key(deseo, color);
    const r = D.inventario.find(x => key(x.deseo, x.color) === k);
    if (r) r.hechas = Math.max(0, r.hechas + delta); else D.inventario.push({ deseo, color, hechas: Math.max(0, delta) });
  }

  function cambiar(deseo, color, delta) {
    const k = key(deseo, color);
    const r = D.inventario.find(x => key(x.deseo, x.color) === k);
    if (delta < 0 && (!r || r.hechas <= 0)) return;            // no baja de 0
    aplicarLocal(deseo, color, delta);
    pendientes[k] = pendientes[k] || { deseo, color, delta: 0 };
    pendientes[k].delta += delta;
    if (pendientes[k].delta === 0) delete pendientes[k];
    pintar(D); estado();
    clearTimeout(timerEnvio);
    timerEnvio = setTimeout(enviarCambios, 600);
  }

  async function enviarCambios() {
    clearTimeout(timerEnvio);
    if (enviando) { timerEnvio = setTimeout(enviarCambios, 300); return; }
    const items = Object.values(pendientes);
    if (!items.length) { estado(); return; }
    pendientes = {};
    enviando = true; ocupado(true);
    try {
      const d = await api('cambiarVarios', { items });
      enviando = false; ocupado(false);
      recibir(d);
    } catch (e) {
      // Se devuelven a la cola para reintentar sin perder ningún toque
      items.forEach(it => { const k = key(it.deseo, it.color);
        pendientes[k] = pendientes[k] || { deseo: it.deseo, color: it.color, delta: 0 }; pendientes[k].delta += it.delta; });
      enviando = false; ocupado(false); estado(true);
    }
  }

  document.getElementById('inv').addEventListener('click', e => {
    const b = e.target.closest('button[data-c]'); if (!b) return;
    cambiar(b.dataset.d, b.dataset.c, Number(b.dataset.x));
  });

  function nombre(id) { const p = D.paquetes.find(x => x.id === id); return p ? p.persona : 'Paquete'; }
  // La fila que acabas de armar o deshacer se queda en su pestaña y grupo hasta que cambies de pestaña o busques
  function fijar(id) { const p = D.paquetes.find(x => x.id === id); if (!p || id in fijos) return;
    fijos[id] = { tab: pestana, r: pestana === 'a' ? (p.estado === 'Entregado' ? 1 : 0) : (faltan(p) ? 1 : 0) }; }

  async function entregar(id) {
    fijar(id);
    await enviarCambios();
    ocupado(true);
    api('entregar', { id }).then(d => { ocupado(false); recibir(d);
      avisoRico({ titulo: `${nombre(id)}: entregado`, detalle: 'El paquete ya está en manos de quien lo compró', tipo: 'ok', accion: 'Deshacer', fn: () => desentregar(id) }); }).catch(error);
  }
  async function desentregar(id) {
    fijar(id);
    await enviarCambios();
    ocupado(true);
    api('desentregar', { id }).then(d => { ocupado(false); recibir(d); aviso('Entrega deshecha. El paquete volvió a Por entregar.'); }).catch(error);
  }

  async function armar(id) {
    confirmId = null; fijar(id);
    await enviarCambios();
    ocupado(true);
    api('armar', { id }).then(d => { ocupado(false); recibir(d);
      aviso(`${nombre(id)}: armado`, 'Deshacer', () => desarmar(id)); }).catch(error);
  }
  async function desarmar(id) {
    fijar(id);
    await enviarCambios();
    ocupado(true);
    api('desarmar', { id }).then(d => { ocupado(false); recibir(d); aviso('Armado deshecho. Las velas volvieron al inventario.'); }).catch(error);
  }

  document.getElementById('paq').addEventListener('click', e => {
    const b = e.target.closest('button[data-acc]'); if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.acc === 'abrir') { abierto = abierto === id ? null : id; confirmId = null; forms.sin = null; pintar(D); return; }
    if (b.dataset.acc === 'armar') { if (b.dataset.falta === '1') { confirmId = id; pintar(D); } else armar(id); }
    else if (b.dataset.acc === 'armarYa') armar(id);
    else if (b.dataset.acc === 'cancelar') { confirmId = null; pintar(D); }
    else if (b.dataset.acc === 'desarmar') desarmar(id);
    else if (b.dataset.acc === 'entregar') entregar(id);
    else if (b.dataset.acc === 'desentregar') desentregar(id);
  });

  const inpB = document.getElementById('buscar');
  inpB.addEventListener('input', () => { busqueda = norm(inpB.value); soltarFijos();
    document.getElementById('buscarBox').classList.toggle('lleno', !!inpB.value); pintar(D); });
  document.getElementById('limpiar').addEventListener('click', () => { inpB.value = ''; inpB.dispatchEvent(new Event('input')); inpB.focus(); });

  function ir(v) {
    document.getElementById('vVelas').style.display = v === 'V' ? 'block' : 'none';
    document.getElementById('vPaq').style.display = v === 'P' ? 'block' : 'none';
    document.getElementById('nV').classList.toggle('on', v === 'V');
    document.getElementById('nP').classList.toggle('on', v === 'P');
    ['nV','nP'].forEach(id => { const on = (id === 'nV') === (v === 'V');
      if (on) document.getElementById(id).setAttribute('aria-current', 'page'); else document.getElementById(id).removeAttribute('aria-current'); });
    document.getElementById('titulo').textContent = v === 'V' ? 'Velas' : 'Paquetes';
    document.getElementById('fab').hidden = v !== 'P';
    soltarFijos(); pintar(D);
    window.scrollTo(0, 0);
  }

  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    document.querySelectorAll('#seg button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
    pestana = b.dataset.t; abierto = null; soltarFijos(); pintar(D);
  });

  // Si la otra persona cambió algo, al volver a la app se actualiza
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !enviando && !Object.keys(pendientes).length) cargar();
  });

  cargar();
</script>
</body>
</html>
