<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velas de deseos</title>
<meta name="theme-color" content="#f6f3ee">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --line:#e6e1d8; --line2:#cfc8bb;
    --txt:#2b2622; --txt2:#6f675e; --muted:#a39b90;
    --rojo:#c0392b; --rojo-bg:#fbeaea; --verde:#3b7a17; --verde-bg:#eaf3de;
    --rosa:#b03a68; --acc:#1f6fb2; --acc-bg:#e6f1fb; --warn:#8a5a00; --warn-bg:#fdf1d6;
    --ok:#2f7a33; --ok-bg:#e5f3e6; --cafe:#7a4e2d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
  header i{font-size:22px;color:#c98a2b}
  header h1{font-size:19px;font-weight:600;margin:0}
  main{padding:0 14px 90px;max-width:560px;margin:0 auto}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .mt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .mt small{display:block;font-size:12px;color:var(--txt2)}
  .mt b{font-size:24px;font-weight:600}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
  .head,.row{display:grid;grid-template-columns:1fr 104px 104px;gap:6px;align-items:center}
  .head{font-size:12px;color:var(--txt2);padding:10px 0 4px}
  .row{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
  .cell{text-align:center}
  .ctr{display:flex;align-items:center;justify-content:center;gap:4px}
  .ctr button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:17px;color:var(--txt);cursor:pointer;touch-action:manipulation}
  .ctr button:active{transform:scale(.95);background:var(--bg)}
  .ctr b{min-width:24px;font-weight:600}
  .falt{font-size:11px;margin-top:2px}
  .falt.no{color:var(--rojo)} .falt.si{color:var(--ok)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chips button{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--txt);cursor:pointer}
  .chips button.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.5}
  .card.esp{border-style:dashed}
  .card.arm{opacity:.7}
  .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ctop b{font-weight:600}
  .sub{color:var(--txt2);font-size:13px;margin-bottom:6px}
  .pill{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-listo{background:var(--acc-bg);color:var(--acc)} .p-falta{background:var(--rojo-bg);color:var(--rojo)}
  .p-arm{background:var(--ok-bg);color:var(--ok)} .p-esp{background:var(--warn-bg);color:var(--warn)}
  .lbl-r{color:var(--rojo);font-weight:600} .lbl-v{color:var(--verde);font-weight:600} .lbl-p{color:var(--rosa);font-weight:600}
  .aviso{font-size:12px;margin-top:6px;color:var(--rojo)}
  .btn{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:14px;cursor:pointer;color:var(--txt)}
  .btn.main{background:var(--cafe);color:#fff;border-color:var(--cafe)}
  .btn:active{transform:scale(.98)}
  .btn.link{border:none;background:none;color:var(--txt2);text-decoration:underline;margin-top:4px;padding:4px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:none;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--txt2);cursor:pointer}
  nav button i{font-size:24px}
  nav button.on{color:var(--cafe);font-weight:600}
  .vacio{color:var(--txt2);font-size:14px;text-align:center;padding:24px 0}
  #cargando{position:fixed;top:12px;right:14px;font-size:12px;color:var(--txt2);display:none}
  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--txt);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<header><i class="ti ti-flame"></i><h1 id="titulo">Velas</h1></header>
<div id="cargando">Guardando…</div>
<div class="toast" id="toast"></div>

<main>
  <section id="vVelas">
    <div class="metrics">
      <div class="mt"><small>Faltan rojas</small><b id="mR" style="color:var(--rojo)">–</b></div>
      <div class="mt"><small>Faltan verdes</small><b id="mV" style="color:var(--verde)">–</b></div>
    </div>
    <div class="box">
      <div class="head"><span>Deseo</span><span class="cell"><span class="dot" style="background:var(--rojo)"></span>Roja</span><span class="cell"><span class="dot" style="background:var(--verde)"></span>Verde</span></div>
      <div id="inv"><div class="vacio">Cargando…</div></div>
    </div>
  </section>

  <section id="vPaq" style="display:none">
    <div class="metrics">
      <div class="mt"><small>Por armar</small><b id="mP">–</b></div>
      <div class="mt"><small>Armados</small><b id="mA" style="color:var(--ok)">–</b></div>
    </div>
    <div class="chips" id="chips">
      <button data-f="todos" class="on">Todos</button>
      <button data-f="listo">Listos</button>
      <button data-f="falta">Faltan velas</button>
      <button data-f="arm">Armados</button>
      <button data-f="esp">Sin deseos</button>
    </div>
    <div id="paq"></div>
  </section>
</main>

<nav>
  <button id="nV" class="on" onclick="ir('V')"><i class="ti ti-candle"></i>Velas</button>
  <button id="nP" onclick="ir('P')"><i class="ti ti-gift"></i>Paquetes</button>
</nav>

<script>
  // Pega aquí la URL de la implementación de Apps Script (termina en /exec)
  const API_URL = 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT';

  async function api(action, params) {
    let res;
    if (action === 'getData') {
      res = await fetch(API_URL + '?action=getData&t=' + Date.now());
    } else {
      // text/plain evita el bloqueo CORS de Apps Script
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                   body: JSON.stringify(Object.assign({ action }, params)) });
    }
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error desconocido');
    return json.data;
  }

  let D = { paquetes: [], inventario: [], deseos: [] };
  let filtro = 'todos';
  const COLS = [ { k:'rojas', color:'Rojo', lbl:'Rojas', cls:'lbl-r', txt:'roja' },
                 { k:'verdes', color:'Verde', lbl:'Verdes', cls:'lbl-v', txt:'verde' },
                 { k:'rosadas', color:'Rosado', lbl:'Rosada', cls:'lbl-p', txt:'rosada' } ];
  const key = (d, c) => d.toLowerCase() + '|' + c.toLowerCase();
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  function cargar() {
    if (API_URL.startsWith('PEGA')) { document.getElementById('inv').innerHTML = '<div class="vacio">Falta poner la URL de Apps Script en API_URL.</div>'; return; }
    api('getData').then(pintar).catch(error);
  }
  function error(e) { ocupado(false); aviso('Algo falló: ' + (e && e.message ? e.message : e)); }
  function ocupado(on) { document.getElementById('cargando').style.display = on ? 'block' : 'none'; }
  function aviso(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2500); }

  function stockMap() { const m = {}; D.inventario.forEach(r => m[key(r.deseo, r.color)] = { deseo:r.deseo, color:r.color, n:r.hechas }); return m; }
  function necesarioMap() {
    const m = {};
    D.paquetes.filter(p => p.estado === 'Pendiente').forEach(p =>
      COLS.forEach(c => p[c.k].forEach(d => { const k = key(d, c.color); m[k] = (m[k] || 0) + 1; })));
    return m;
  }
  function faltantes(p, st) {
    const pide = {};
    COLS.forEach(c => p[c.k].forEach(d => { const k = key(d, c.color); pide[k] = pide[k] || { d, c, n:0 }; pide[k].n++; }));
    return Object.keys(pide).map(k => { const tiene = st[k] ? st[k].n : 0; const x = pide[k];
      return tiene < x.n ? `${x.d} ${x.c.txt} ×${x.n - tiene}` : null; }).filter(Boolean);
  }

  function pintar(data) {
    ocupado(false);
    D = data;
    const st = stockMap(), nec = necesarioMap();

    // Lista de deseos: los de la pestaña Deseos + cualquiera que aparezca en paquetes o inventario
    const orden = [...D.deseos];
    const add = d => { if (!orden.some(x => x.toLowerCase() === d.toLowerCase())) orden.push(d); };
    D.inventario.forEach(r => add(r.deseo));
    D.paquetes.forEach(p => COLS.forEach(c => p[c.k].forEach(add)));

    let fr = 0, fv = 0;
    const celda = (d, color) => {
      const k = key(d, color), n = st[k] ? st[k].n : 0, f = Math.max(0, (nec[k] || 0) - n);
      if (color === 'Rojo') fr += f; if (color === 'Verde') fv += f;
      return `<div class="cell"><div class="ctr"><button aria-label="Restar" onclick="cambiar('${esc(d)}','${color}',-1)">−</button><b>${n}</b><button aria-label="Sumar" onclick="cambiar('${esc(d)}','${color}',1)">+</button></div>
              <div class="falt ${f ? 'no' : 'si'}">${f ? 'faltan ' + f : (nec[k] ? 'completo' : '—')}</div></div>`;
    };
    let html = orden.map(d => `<div class="row"><span>${esc(d)}</span>${celda(d,'Rojo')}${celda(d,'Verde')}</div>`).join('');
    // Rosadas: solo los deseos que tengan rosadas pedidas o en inventario
    const rosas = orden.filter(d => nec[key(d,'Rosado')] || st[key(d,'Rosado')]);
    html += rosas.map(d => { const k = key(d,'Rosado'), n = st[k] ? st[k].n : 0, f = Math.max(0,(nec[k]||0)-n);
      return `<div class="row"><span>${esc(d)} <span style="font-size:12px;color:var(--rosa)">rosada</span></span>
        <div class="cell"><div class="ctr"><button aria-label="Restar" onclick="cambiar('${esc(d)}','Rosado',-1)">−</button><b>${n}</b><button aria-label="Sumar" onclick="cambiar('${esc(d)}','Rosado',1)">+</button></div>
        <div class="falt ${f?'no':'si'}">${f ? 'falta ' + f : 'completo'}</div></div><span></span></div>`; }).join('');
    document.getElementById('inv').innerHTML = html || '<div class="vacio">No hay deseos todavía.</div>';
    document.getElementById('mR').textContent = fr;
    document.getElementById('mV').textContent = fv;

    // Paquetes
    const pend = D.paquetes.filter(p => p.estado === 'Pendiente');
    document.getElementById('mP').textContent = pend.length;
    document.getElementById('mA').textContent = D.paquetes.filter(p => p.estado === 'Armado').length;

    const lista = D.paquetes.filter(p => {
      if (filtro === 'todos') return true;
      if (filtro === 'arm') return p.estado === 'Armado';
      if (filtro === 'esp') return p.estado === 'Esperando deseos';
      if (p.estado !== 'Pendiente') return false;
      const f = faltantes(p, st).length;
      return filtro === 'listo' ? !f : !!f;
    }).sort((a, b) => rango(a, st) - rango(b, st));

    document.getElementById('paq').innerHTML = lista.map(p => tarjeta(p, st)).join('') ||
      '<div class="vacio">No hay paquetes en este filtro.</div>';
  }

  // Orden: listos primero, luego los que les faltan velas, luego sin deseos, al final armados
  function rango(p, st) {
    if (p.estado === 'Armado') return 3;
    if (p.estado === 'Esperando deseos') return 2;
    return faltantes(p, st).length ? 1 : 0;
  }

  function tarjeta(p, st) {
    const titulo = `<b>${esc(p.persona)} · paquete ${esc(p.numero)}</b>`;
    const sub = `<div class="sub">Paquete de ${p.tamano} · ${esc(p.color)}</div>`;
    if (p.estado === 'Esperando deseos')
      return `<div class="card esp"><div class="ctop">${titulo}<span class="pill p-esp">Sin deseos</span></div>${sub}</div>`;
    const arm = p.estado === 'Armado', f = arm ? [] : faltantes(p, st);
    const pill = arm ? '<span class="pill p-arm">Armado</span>' : f.length ? '<span class="pill p-falta">Faltan velas</span>' : '<span class="pill p-listo">Listo para armar</span>';
    const lineas = COLS.map(c => p[c.k].length ? `<div><span class="${c.cls}">${c.lbl}:</span> ${p[c.k].map(esc).join(', ')}</div>` : '').join('');
    const total = COLS.reduce((s, c) => s + p[c.k].length, 0);
    const cuenta = total !== p.tamano ? `<div class="aviso">Tiene ${total} deseos y el paquete es de ${p.tamano}. Revisa la hoja.</div>` : '';
    const falta = f.length ? `<div class="aviso">Te falta: ${f.join(', ')}</div>` : '';
    const btn = arm
      ? `<div class="sub" style="margin:8px 0 0">Armado el ${esc(p.fecha)}</div><button class="btn link" onclick="desarmar('${esc(p.id)}')">Deshacer</button>`
      : `<button class="btn main" onclick="armar('${esc(p.id)}', ${f.length > 0})"><i class="ti ti-check"></i> Marcar como armado</button>`;
    return `<div class="card ${arm ? 'arm' : ''}"><div class="ctop">${titulo}${pill}</div>${sub}${lineas}${cuenta}${falta}${btn}</div>`;
  }

  function cambiar(deseo, color, delta) {
    // Cambio inmediato en pantalla, luego se guarda
    const k = key(deseo, color);
    const r = D.inventario.find(x => key(x.deseo, x.color) === k);
    if (r) r.hechas = Math.max(0, r.hechas + delta); else D.inventario.push({ deseo, color, hechas: Math.max(0, delta) });
    pintar(D); ocupado(true);
    api('cambiarStock', { deseo, color, delta }).then(pintar).catch(e => { error(e); cargar(); });
  }

  function armar(id, conFaltantes) {
    if (conFaltantes && !confirm('A este paquete le faltan velas en el inventario. ¿Marcarlo como armado igual?')) return;
    ocupado(true);
    api('armar', { id }).then(d => { pintar(d); aviso('Paquete armado'); }).catch(error);
  }
  function desarmar(id) {
    if (!confirm('¿Deshacer el armado? Las velas vuelven al inventario.')) return;
    ocupado(true);
    api('desarmar', { id }).then(d => { pintar(d); aviso('Armado deshecho'); }).catch(error);
  }

  function ir(v) {
    document.getElementById('vVelas').style.display = v === 'V' ? 'block' : 'none';
    document.getElementById('vPaq').style.display = v === 'P' ? 'block' : 'none';
    document.getElementById('nV').classList.toggle('on', v === 'V');
    document.getElementById('nP').classList.toggle('on', v === 'P');
    document.getElementById('titulo').textContent = v === 'V' ? 'Velas' : 'Paquetes';
    window.scrollTo(0, 0);
  }

  document.getElementById('chips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#chips button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); filtro = b.dataset.f; pintar(D);
  });

  // Si la otra persona cambió algo, al volver a la app se actualiza
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });

  cargar();
</script>
</body>
</html>
